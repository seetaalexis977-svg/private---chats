<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Private Chats V2</title>
<style>
body{margin:0;font-family:Arial;background:#ece5dd}
.top{background:#075e54;color:white;padding:14px;font-size:19px;font-weight:bold;display:flex;justify-content:space-between}
.box{background:white;margin:10px;padding:14px;border-radius:12px}
input,select{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:8px;font-size:16px;box-sizing:border-box}
button{width:100%;padding:13px;background:#25d366;border:none;border-radius:8px;color:white;font-size:16px;font-weight:bold;margin-top:7px}
.tabs{display:flex;background:white;margin:10px;border-radius:10px;overflow:hidden}
.tabs div{flex:1;text-align:center;padding:12px;font-weight:bold;cursor:pointer}
.tabs .on{color:#075e54;border-bottom:3px solid #075e54}
.item{padding:12px;border-bottom:1px solid #eee}
.item b{display:block}
.item span{color:#666;font-size:13px}
.row{display:flex;gap:6px;margin-top:6px}
.row button{padding:8px;font-size:13px}
.msgs{height:260px;overflow-y:auto;background:#ece5dd;padding:8px;border-radius:8px}
.msg{background:white;padding:8px 10px;margin:6px 0;border-radius:8px;max-width:85%}
.me{background:#dcf8c6;margin-left:auto}
video{width:100%;background:black;border-radius:10px;margin-top:8px}
.callbox{background:#111;color:white;padding:12px;border-radius:12px;margin:10px;display:none;text-align:center}
</style>
</head>
<body>
<div class="top"><span>Private Chats V2 🔥</span><span id="myName">Guest</span></div>
<div class="box" id="authBox">
<h3>Create Account / Login</h3>
<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Phone e.g +27721234567">
<select id="province"><option value="">Province</option><option>Limpopo</option><option>Gauteng</option><option>Mpumalanga</option><option>North West</option><option>Free State</option><option>KwaZulu-Natal</option><option>Eastern Cape</option><option>Western Cape</option><option>Northern Cape</option></select>
<select id="language"><option value="">Language</option><option>Sotho</option><option>Sepedi</option><option>Zulu</option><option>Xhosa</option><option>Tswana</option><option>Venda</option><option>Tsonga</option><option>Afrikaans</option><option>English</option><option>Swati</option><option>Ndebele</option></select>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="register()">CREATE ACCOUNT</button>
<button onclick="login()" style="background:#075e54">LOGIN</button>
<p id="msg" style="text-align:center;font-size:13px"></p>
</div>
<div class="tabs"><div id="tab1" class="on" onclick="showTab('friends')">Friends</div><div id="tab2" onclick="showTab('requests')">Requests</div><div id="tab3" onclick="showTab('group')">Group</div></div>
<div class="box" id="friendsView"><h3>All People - Add Friend</h3><div id="userList">Login first...</div></div>
<div class="box" id="requestsView" style="display:none"><h3>Friend Requests</h3><div id="reqList">No requests yet</div></div>
<div class="box" id="groupView" style="display:none"><div class="item" onclick="openGroup()"><b>🌍 Private Chats Group</b><span>Everyone - Tap to chat</span></div></div>
<div class="box" id="chatbox" style="display:none">
<h3 id="chatTitle">Chat</h3>
<div class="msgs" id="msgs"></div>
<input id="msgInput" placeholder="Type message...">
<button onclick="sendMsg()">SEND</button>
<div class="row"><button onclick="startCall(false)" style="background:#075e54">📞 VOICE CALL</button><button onclick="startCall(true)" style="background:#128c7e">🎥 VIDEO CALL</button></div>
<button onclick="closeChat()" style="background:#333">BACK</button>
</div>
<div class="callbox" id="callbox">
<h3 id="callTitle">Incoming Call...</h3>
<video id="localVideo" autoplay muted playsinline></video>
<video id="remoteVideo" autoplay playsinline></video>
<div class="row"><button onclick="acceptCall()" style="background:#25d366">✅ ACCEPT</button><button onclick="endCall()" style="background:red">❌ END</button></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, onSnapshot, addDoc, getDocs, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCTeosLIvoMvpGrN_ECchXY4DFKZpf8jck",
  authDomain: "private-chats-8a260.firebaseapp.com",
  projectId: "private-chats-8a260",
  storageBucket: "private-chats-8a260.firebasestorage.app",
  messagingSenderId: "531756135269",
  appId: "1:531756135269:web:b438c25501fca63a9f278c",
  measurementId: "G-YE67W66CZR"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let myUid="", myName="", currentChatId="", currentFriendUid="", currentCallId="", pc=null, localStream=null, isVideo=false, incomingOffer=null;
function showMsg(t){document.getElementById('msg').innerText=t}
window.register=async function(){
  const name=document.getElementById('name').value, phone=document.getElementById('phone').value, province=document.getElementById('province').value, language=document.getElementById('language').value, email=document.getElementById('email').value, pass=document.getElementById('password').value;
  if(!name||!phone||!province||!language||!email||!pass){showMsg("Please fill everything");return;}
  try{const c=await createUserWithEmailAndPassword(auth,email,pass); await setDoc(doc(db,"users",c.user.uid),{name,phone,province,language,email,created:Date.now()}); showMsg("Account created! Welcome "+name);}catch(e){showMsg(e.message)}
}
window.login=async function(){
  try{await signInWithEmailAndPassword(auth,document.getElementById('email').value,document.getElementById('password').value); showMsg("Logged in!");}catch(e){showMsg(e.message)}
}
onAuthStateChanged(auth, async (user)=>{
  if(!user) return; myUid=user.uid;
  const snap=await getDoc(doc(db,"users",myUid)); myName=snap.exists()?snap.data().name:"Me";
  document.getElementById('myName').innerText=myName;
  loadUsers(); loadRequests(); listenForCalls();
});
async function loadUsers(){
  const q=await getDocs(collection(db,"users")); let html="";
  q.forEach(d=>{ if(d.id===myUid) return; const u=d.data();
    html+=`<div class="item"><b>${u.name}</b><span>${u.province} • ${u.language} • ${u.phone}</span><div class="row"><button onclick="sendFriend('${d.id}')">+ ADD FRIEND</button><button onclick="openChat('${d.id}','${u.name}')" style="background:#075e54">💬 CHAT</button></div></div>`;
  });
  document.getElementById('userList').innerHTML=html||"No other people yet. Invite someone!";
}
window.sendFriend=async function(toUid){ await addDoc(collection(db,"friendRequests"),{from:myUid,fromName:myName,to:toUid,status:"pending",time:Date.now()}); alert("Friend request sent!"); }
function loadRequests(){
  const q=query(collection(db,"friendRequests"),where("to","==",myUid));
  onSnapshot(q,(snap)=>{ let html=""; snap.forEach(d=>{ const r=d.data(); if(r.status==="pending") html+=`<div class="item"><b>${r.fromName} wants to be your friend</b><div class="row"><button onclick="acceptFriend('${d.id}','${r.from}')">✅ ACCEPT</button></div></div>`; }); document.getElementById('reqList').innerHTML=html||"No requests yet"; });
}
window.acceptFriend=async function(reqId,fromUid){ await updateDoc(doc(db,"friendRequests",reqId),{status:"accepted"}); alert("You are now friends!"); }
window.showTab=function(t){
  document.getElementById('tab1').className=t==='friends'?'on':''; document.getElementById('tab2').className=t==='requests'?'on':''; document.getElementById('tab3').className=t==='group'?'on':'';
  document.getElementById('friendsView').style.display=t==='friends'?'block':'none'; document.getElementById('requestsView').style.display=t==='requests'?'block':'none'; document.getElementById('groupView').style.display=t==='group'?'block':'none';
}
window.openChat=function(otherUid,title){ currentFriendUid=otherUid; currentChatId=[myUid,otherUid].sort().join("_"); document.getElementById('chatTitle').innerText=title; document.getElementById('chatbox').style.display="block"; listenMsgs(); }
window.openGroup=function(){ currentFriendUid="group"; currentChatId="main-group"; document.getElementById('chatTitle').innerText="🌍 Private Chats Group"; document.getElementById('chatbox').style.display="block"; listenMsgs(); }
function listenMsgs(){ const q=query(collection(db,"chats",currentChatId,"messages"),orderBy("time")); onSnapshot(q,(snap)=>{ let html=""; snap.forEach(d=>{ const m=d.data(); html+=`<div class="msg ${m.sender===myUid?'me':''}"><b>${m.senderName}</b><br>${m.text}</div>`; }); document.getElementById('msgs').innerHTML=html; document.getElementById('msgs').scrollTop=99999; }); }
window.sendMsg=async function(){ const text=document.getElementById('msgInput').value; if(!text) return; await addDoc(collection(db,"chats",currentChatId,"messages"),{text,sender:myUid,senderName:myName,time:Date.now()}); document.getElementById('msgInput').value=""; }
window.closeChat=function(){document.getElementById('chatbox').style.display="none";}
const servers={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
async function createPC(callId){
  pc=new RTCPeerConnection(servers);
  localStream=await navigator.mediaDevices.getUserMedia({audio:true, video:isVideo});
  document.getElementById('localVideo').srcObject=localStream;
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.ontrack=e=>{document.getElementById('remoteVideo').srcObject=e.streams[0]};
  pc.onicecandidate=e=>{ if(e.candidate) addDoc(collection(db,"calls",callId,"candidates"),{candidate:e.candidate.toJSON(), from:myUid}); };
  return pc;
}
window.startCall=async function(video){
  if(!currentFriendUid||currentFriendUid==="group"){alert("Open a 1-to-1 chat first to call that person");return;}
  isVideo=video; document.getElementById('callbox').style.display="block"; document.getElementById('callTitle').innerText=video?"📹 Calling video...":"📞 Calling voice...";
  const callDoc=await addDoc(collection(db,"calls"),{from:myUid,fromName:myName,to:currentFriendUid,type:video?"video":"voice",status:"ringing",time:Date.now()});
  currentCallId=callDoc.id; await createPC(currentCallId);
  const offer=await pc.createOffer(); await pc.setLocalDescription(offer);
  await updateDoc(doc(db,"calls",currentCallId),{offer:{type:offer.type,sdp:offer.sdp}});
  onSnapshot(doc(db,"calls",currentCallId), async (snap)=>{ const d=snap.data(); if(d && d.answer && !pc.currentRemoteDescription){ await pc.setRemoteDescription(new RTCSessionDescription(d.answer)); } if(d && d.status==="ended"){ endCall(); } });
  onSnapshot(collection(db,"calls",currentCallId,"candidates"),(snap)=>{ snap.forEach(async docSnap=>{ const c=docSnap.data(); if(c.from!==myUid){ try{ await pc.addIceCandidate(new RTCIceCandidate(c.candidate)); }catch(e){} } }); });
}
function listenForCalls(){
  const q=query(collection(db,"calls"),where("to","==",myUid),where("status","==","ringing"));
  onSnapshot(q,(snap)=>{ snap.forEach(d=>{ const data=d.data(); if(data.from===myUid) return; currentCallId=d.id; currentFriendUid=data.from; incomingOffer=data.offer; document.getElementById('callbox').style.display="block"; document.getElementById('callTitle').innerText="📞 "+data.fromName+" is calling you - "+data.type; }); });
}
window.acceptCall=async function(){
  if(!currentCallId) return; isVideo=true; document.getElementById('callTitle').innerText="Connected! Talking...";
  await createPC(currentCallId);
  if(incomingOffer){ await pc.setRemoteDescription(new RTCSessionDescription(incomingOffer)); }
  const answer=await pc.createAnswer(); await pc.setLocalDescription(answer);
  await updateDoc(doc(db,"calls",currentCallId),{answer:{type:answer.type,sdp:answer.sdp}, status:"connected"});
  onSnapshot(collection(db,"calls",currentCallId,"candidates"),(snap)=>{ snap.forEach(async docSnap=>{ const c=docSnap.data(); if(c.from!==myUid){ try{ await pc.addIceCandidate(new RTCIceCandidate(c.candidate)); }catch(e){} } }); });
}
window.endCall=async function(){
  if(pc) pc.close(); if(localStream) localStream.getTracks().forEach(t=>t.stop());
  if(currentCallId){ try{ await updateDoc(doc(db,"calls",currentCallId),{status:"ended"}); }catch(e){} }
  document.getElementById('callbox').style.display="none"; document.getElementById('localVideo').srcObject=null; document.getElementById('remoteVideo').srcObject=null; currentCallId=""; pc=null;
}
</script>
</body>
                                                                                </html>
